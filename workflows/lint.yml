name: Lint & Format Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install --save-dev eslint prettier

    - name: Run ESLint
      run: npx eslint . --ext .js,.html 2>/dev/null || true
      continue-on-error: true

    - name: Check code formatting with Prettier
      run: npx prettier --check . --ignore-path .gitignore 2>/dev/null || true
      continue-on-error: true

    - name: Report results
      run: echo "✅ Linting check complete. Review above for any issues."
